<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的音乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        .disc {
            width: 180px;
            height: 180px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 0 50px rgba(102, 126, 234, 0.5);
            animation: rotate 8s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        
        .disc::after {
            content: '';
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #1a1a2e;
            position: absolute;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .disc.paused {
            animation-play-state: paused;
        }
        
        .song-icon {
            font-size: 3.5em;
            z-index: 1;
        }
        
        .song-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
        }
        
        .song-artist {
            color: #aaa;
            margin-bottom: 20px;
            font-size: 1em;
        }
        
        .player-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .play-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        
        .play-btn:active {
            transform: scale(0.95);
        }
        
        audio {
            width: 100%;
            outline: none;
            margin-top: 5px;
        }
        
        .tip {
            color: #888;
            margin-top: 15px;
            font-size: 0.85em;
        }
        
        .footer {
            text-align: center;
            color: #555;
            margin-top: 20px;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="disc paused" id="disc" onclick="togglePlay()">
            <div class="song-icon">🎧</div>
        </div>
        
        <div class="player-card">
            <div class="song-title">大可会员专属定制</div>
            <div class="song-artist">Diaxipam</div>
            
            <button class="play-btn" id="playBtn" onclick="togglePlay()">▶ 点击播放</button>
            
            <audio id="player" controls loop preload="auto">
                <source src="music/qqq.mp3" type="audio/mpeg">
            </audio>
            
            <p class="tip" id="tip">🎵 正在尝试自动播放...</p>
        </div>
        
        <div class="footer">
            <p>分享给朋友，一起听歌吧</p>
        </div>
    </div>
    
    <script>
        const audio = document.getElementById('player');
        const disc = document.getElementById('disc');
        const playBtn = document.getElementById('playBtn');
        const tip = document.getElementById('tip');
        
        // 页面加载后尝试自动播放
        window.addEventListener('load', function() {
            audio.play().then(function() {
                disc.classList.remove('paused');
                playBtn.textContent = '⏸ 暂停播放';
                tip.textContent = '🎵 正在播放';
            }).catch(function() {
                disc.classList.add('paused');
                playBtn.textContent = '▶ 点击播放';
                tip.textContent = '👆 点击按钮或播放器开始收听';
            });
        });
        
        // 自定义按钮切换播放/暂停
        function togglePlay() {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }
        
        // 监听音频播放事件
        audio.addEventListener('play', function() {
            disc.classList.remove('paused');
            playBtn.textContent = '⏸ 暂停播放';
            tip.textContent = '🎵 正在播放';
        });
        
        // 监听音频暂停事件
        audio.addEventListener('pause', function() {
            disc.classList.add('paused');
            playBtn.textContent = '▶ 点击播放';
            tip.textContent = '⏸ 已暂停';
        });
    </script>
</body>
</html>
